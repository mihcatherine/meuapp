<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Organização Financeira</title>
</head>
<body>
<div id="auth" class="authscreen"></div>
<div id="app" class="app hidden">
<header class="topbar">
  <div class="brand"><img src="logo.png" alt="Espada-de-São-Jorge"><div><h1>Organização Financeira</h1></div></div>
  <div class="top-actions"><button class="iconbtn" id="themeBtn" aria-label="Alternar tema">◐</button><button class="iconbtn" id="logoutBtn" aria-label="Sair">↪</button></div>
</header>
<main id="main"></main>
<nav class="bottomnav" aria-label="Navegação">
<button class="active" data-tab="inicio"><span>⌂</span>Início</button>
<button data-tab="lancamentos"><span>↔</span>Lançamentos</button>
<button data-tab="cartoes"><span>▣</span>Cartões</button>
<button data-tab="investimentos"><span>◫</span>Investimentos</button>
<button data-tab="analises"><span>◔</span>Análises</button>
<button data-tab="config"><span>⚙</span>Configurações</button>
</nav>
</div>
<div class="toast hidden" id="toast"></div>
<div class="modal hidden" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="Fechar">×</button></div><form id="form"></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/appwrite@29.3.0"></script>
<script src="appwrite.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
</body>
</html>
